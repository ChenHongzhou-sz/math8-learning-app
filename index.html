<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="八上数学" />
    <title>八年级数学自学 App</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-nav" aria-label="主导航">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">M</div>
          <div>
            <p>八年级上册</p>
            <h1>数学自学</h1>
          </div>
        </div>
        <nav class="nav-list" id="sideNav"></nav>
        <div class="sync-mini" id="syncMini"></div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div>
            <p id="pageEyebrow">今天</p>
            <h2 id="pageTitle">继续把数学学明白</h2>
          </div>
          <div class="top-actions">
            <button class="ghost-button" id="syncOpenButton" type="button">云同步</button>
            <button class="icon-button" id="resetProgress" type="button" title="重置本地进度" aria-label="重置本地进度">↻</button>
          </div>
        </header>

        <section class="screen" id="screen" aria-live="polite"></section>
      </main>

      <nav class="bottom-nav" id="bottomNav" aria-label="底部导航"></nav>
    </div>

    <dialog class="sync-dialog" id="syncDialog">
      <form method="dialog" class="sync-card">
        <div class="dialog-head">
          <div>
            <h3>云同步</h3>
            <p id="syncStatus">登录后可以在不同设备继续学习。</p>
          </div>
          <button class="icon-button compact" value="cancel" type="submit" title="关闭" aria-label="关闭">×</button>
        </div>
        <div class="sync-grid">
          <label>
            邮箱
            <input id="syncEmail" type="email" autocomplete="email" placeholder="student@example.com" />
          </label>
          <label>
            密码
            <input id="syncPassword" type="password" autocomplete="current-password" placeholder="至少 6 位" />
          </label>
        </div>
        <div class="sync-actions">
          <button class="ghost-button" id="signUpButton" type="button">注册</button>
          <button class="primary-button" id="signInButton" type="button">登录并同步</button>
          <button class="ghost-button" id="syncNowButton" type="button">立即同步</button>
          <button class="ghost-button" id="signOutButton" type="button">退出</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status"></div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
